; Compiles; never run on hardware. Build with
;   pio run -d firmware/azimuth/esp32
[env:esp32dev]
platform = espressif32@6.9.0 ; Arduino core 2.x (ledcSetup API)
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../
build_src_filter = +<*> +<../../azctl.c> +<../../azsup.c> +<../../as5048a.c>
